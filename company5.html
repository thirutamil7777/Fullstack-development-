<!DOCTYPE html>
<html>
<head>
<title>Employee Management</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2f7;
}
.header{
    background:#263238;
    color:white;
    padding:25px;
    text-align:center;
}
.card{
    width:650px;
    margin:35px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px #bbb;
}
h2{
    color:#263238;
    border-bottom:2px solid #ddd;
    padding-bottom:10px;
}
label{
    display:inline-block;
    width:130px;
    margin:10px 0;
}
input,select,textarea{
    padding:9px;
    width:60%;
    border:1px solid #ccc;
    border-radius:5px;
}
input[type=radio]{
    width:auto;
}
button{
    background:#263238;
    color:white;
    padding:10px 25px;
    border:0;
    border-radius:5px;
    margin-top:15px;
}
.footer{
    text-align:center;
    color:#666;
}
</style>
</head>

<body>

<div class="header">
    <h1>ABC Technologies</h1>
    <p>Employee Management Portal</p>
</div>

<div class="card">

<h2>Leave Application</h2>

<form>

<label>Employee Name</label>
<input type="text" placeholder="Enter name"><br>

<label>Employee ID</label>
<input type="text" placeholder="Enter ID"><br>

<label>Department</label>
<select>
    <option>Computer Science</option>
    <option>Human Resource</option>
    <option>Finance</option>
</select><br>

<label>Leave Type</label>
<input type="radio" name="l"> Casual
<input type="radio" name="l"> Sick
<input type="radio" name="l"> Emergency
<br>

<label>From Date</label>
<input type="date"><br>

<label>To Date</label>
<input type="date"><br>

<label>Reason</label>
<textarea rows="4" placeholder="Reason for leave"></textarea>

<center>
<button type="submit">Apply Leave</button>
<button type="reset">Clear</button>
</center>

</form>
</div>

<p class="footer">© 2026 ABC Technologies</p>

</body>
</html>
